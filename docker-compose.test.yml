version: '3.8'

services:
  scheduler:
    build:
      context: ./Scheduler
      dockerfile: Dockerfile
    container_name: pi-scheduler-test
    ports:
      - "8000:8000"
      - "7447:7447"
    environment:
      - SCHEDULER_HOST=0.0.0.0
      - SCHEDULER_PORT=8000
      - SCHEDULER_LOG_LEVEL=debug
      - SCHEDULER_ENVIRONMENT=development
    networks:
      - pi-test-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-worker-1:
    build:
      context: ./Node
      dockerfile: Dockerfile
    container_name: pi-node-worker-1
    ports:
      - "8080:8080"
    environment:
      - NODE_ID=node-worker-1
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8080
      - NODE_SCHEDULER_URL=http://scheduler:8000
      - NODE_ZENOH_LISTEN_ENDPOINTS=["tcp/0.0.0.0:7448"]
      - NODE_BOOTSTRAP_ROUTERS=["tcp/scheduler:7447"]
    depends_on:
      scheduler:
        condition: service_healthy
    networks:
      - pi-test-net

  node-worker-2:
    build:
      context: ./Node
      dockerfile: Dockerfile
    container_name: pi-node-worker-2
    ports:
      - "8081:8080"
    environment:
      - NODE_ID=node-worker-2
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8080
      - NODE_SCHEDULER_URL=http://scheduler:8000
      - NODE_ZENOH_LISTEN_ENDPOINTS=["tcp/0.0.0.0:7449"]
      - NODE_BOOTSTRAP_ROUTERS=["tcp/scheduler:7447"]
    depends_on:
      scheduler:
        condition: service_healthy
    networks:
      - pi-test-net

networks:
  pi-test-net:
    driver: bridge
