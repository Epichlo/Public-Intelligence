# A local two-node network: one Scheduler, two Nodes, on one bridge.
#
#   .venv/bin/python scripts/mint_token.py --generate-keypair
#   export SCHEDULER_JWT_PUBLIC_KEY="$(cat .secrets/jwt_public_key.pem)"
#   docker compose -f docker-compose.test.yml up --build
#   curl -H "X-Network-Auth-Token: local-dev-token" http://localhost:8000/nodes
#
# The control-plane path above works with no further setup. The GATEWAY path needs a
# real credential by design (ROADMAP C4): an unconfigured Scheduler refuses every
# request rather than fall back to a key of unknown provenance, so the exported
# SCHEDULER_JWT_PUBLIC_KEY is not optional decoration -- without it,
# /v1/chat/completions can only ever answer 401. Mint caller tokens with
# scripts/mint_token.py once the stack is up.
#
# CI runs this stack end to end (.github/workflows/ci.yml::compose-e2e): both nodes
# register, an uncredentialed request is refused, and one credentialed request
# crosses gateway -> scheduler -> mesh -> node and comes back with generated text.
# Before that job existed this file had never been executed anywhere. Faults found
# before it could run, none of which needed a running stack to find:
#
#   1. `NODE_ID` -- the Node's Settings read `NODE_NODE_ID` (env_prefix `NODE_`
#      plus field `node_id`), so both workers silently kept the default id and the
#      second would collide with the first.
#   2. No auth token on any service. Roadmap 0.1 made the Node's control API fail
#      closed and the Scheduler authenticate to nodes with the credential presented
#      at registration. With none set, every registration and dispatch 401s.
#   3. `NODE_ZENOH_LISTEN_ENDPOINTS` on both workers -- `zenoh_listen_endpoints` is
#      a SCHEDULER field and the Node has no such setting, so it was silently
#      ignored. A node dials out and holds the session (ROADMAP 1.1); it does not
#      listen, so the lines were removed rather than renamed.
#   4. No gateway signing key (see above).
#   5. Both images pip-installed from their own package directory as the build
#      context while hard-depending on `public-intelligence-shared`, which exists
#      only at `packages/shared` and has no presence on any index. Neither image
#      could ever have built. The builds below use the REPO ROOT as their context
#      and install shared first -- the order install.sh and CI both already knew.
#   6. The Scheduler's healthcheck ran `curl`, which is not present in
#      python:3.12-slim, so the service could never report healthy --
#      `depends_on: condition: service_healthy` would have deadlocked the nodes
#      forever. It now probes with the stdlib, which the image does contain.
#   7. The shared build template originally ended at WORKDIR with no CMD, so both
#      containers inherited the base image's default -- an interactive python3 on
#      stdin -- and exited the instant they started: no healthcheck could pass, no
#      `depends_on` could resolve, and the E2E job would have timed out on every
#      run. The CMD lines of the package Dockerfiles this file replaced were
#      dropped in the rewrite. Each service now declares its start command
#      explicitly, and
#      tests/test_compose_env_matches_settings.py::test_every_compose_service_declares_a_start_command
#      pins that a commandless container cannot come back silently.
#
# The tokens below are throwaways for local use. They are not secrets and must not
# be reused anywhere reachable.

x-service-build: &service-build
  context: .
  # Escaped $$: compose must pass ${SERVICE_DIR} through to the build, not expand it.
  dockerfile_inline: |
    FROM python:3.12-slim
    ARG SERVICE_DIR
    RUN apt-get update \
        && apt-get install -y --no-install-recommends build-essential \
        && rm -rf /var/lib/apt/lists/*
    COPY packages/shared /tmp/build/packages/shared
    COPY $${SERVICE_DIR} /tmp/build/service
    # shared FIRST: public-intelligence-shared is a local-path dependency with no
    # PyPI presence, so installing the service first makes pip look for it on the
    # index, find nothing, and fail -- the exact failure C8 fixed for install.sh.
    RUN python -m venv /opt/venv \
        && /opt/venv/bin/pip install --no-cache-dir --upgrade pip setuptools wheel \
        && /opt/venv/bin/pip install --no-cache-dir /tmp/build/packages/shared /tmp/build/service \
        && rm -rf /tmp/build
    # Both dollar signs below are doubled on purpose: compose interpolates this
    # whole block -- comments included -- before Docker ever sees it. SERVICE_DIR
    # resolves from ARG at build time, and PATH must be the image's own.
    ENV PATH="/opt/venv/bin:$$PATH" \
        PYTHONUNBUFFERED=1
    RUN groupadd --system app && useradd --system --gid app --create-home app
    USER app
    WORKDIR /home/app

services:
  scheduler:
    build:
      <<: *service-build
      args:
        SERVICE_DIR: packages/scheduler
    container_name: pi-scheduler-test
    # The base image's default command is an interactive python3 reading stdin,
    # which exits the moment its stdin closes: a container with no start command
    # serves nothing and never goes healthy (fault 7 in the header). This is the
    # command the replaced package Dockerfile carried; it lives per-service rather
    # than in the shared template because the three services start different things.
    command: ["uvicorn", "scheduler.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
      - "7447:7447"
    environment:
      - SCHEDULER_HOST=0.0.0.0
      - SCHEDULER_PORT=8000
      - SCHEDULER_LOG_LEVEL=debug
      - SCHEDULER_ENVIRONMENT=development
      - SCHEDULER_NETWORK_AUTH_TOKEN=local-dev-token
      # Mesh envelopes are keyed on each NODE's own credential as of ROADMAP 2.7,
      # so there is no fleet-wide telemetry secret to agree on any more. A comment
      # here used to say both services had to share TELEMETRY_SECRET_KEY; that
      # setting no longer exists.
      #
      # Required for anything beyond registration: export the PUBLIC half of a
      # minted keypair before `up` (see header), or the gateway refuses every
      # request -- deliberately, since ROADMAP C4.
      - SCHEDULER_JWT_PUBLIC_KEY=${SCHEDULER_JWT_PUBLIC_KEY:-}
    networks:
      - pi-test-net
    healthcheck:
      # python, not curl: the runtime image has no curl, so a curl probe never
      # succeeds -- see fault 6 in the header.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  node-worker-1:
    build:
      <<: *service-build
      args:
        SERVICE_DIR: packages/node
    container_name: pi-node-worker-1
    # The command the replaced node Dockerfile carried. Its bind host/port are not
    # hardcoded here because they come from NODE_HOST/NODE_PORT, which this file's
    # env-binding ratchet already pins as names the Node Settings actually read.
    command: ["python", "-m", "node.main"]
    ports:
      - "8080:8080"
    environment:
      # NODE_NODE_ID, not NODE_ID: env_prefix `NODE_` + field `node_id`.
      - NODE_NODE_ID=node-worker-1
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8080
      - NODE_SCHEDULER_URL=http://scheduler:8000
      # Ollama is an external HTTP dependency of the node, wherever it runs. By
      # default this points at a real Ollama on the docker HOST (host-gateway maps
      # the name on Linux too). The `fake-ollama` profile swaps in the stand-in.
      - NODE_OLLAMA_HOST=${NODE_OLLAMA_HOST:-http://host.docker.internal:11434}
      # Two secrets, and the two workers differ in the first one (decision D9).
      # NODE_FLEET_TOKEN is the shared admission secret and matches the Scheduler's
      # SCHEDULER_NETWORK_AUTH_TOKEN; NODE_NETWORK_AUTH_TOKEN is this container's
      # own credential, and the Scheduler stores it to key this node's mesh
      # envelopes. Both workers carried `local-dev-token` for both until D9, which
      # is precisely the collision that made 2.7's per-node isolation untrue --
      # visible here, in the only file that runs two nodes at once.
      - NODE_NETWORK_AUTH_TOKEN=worker-1-own-credential
      - NODE_FLEET_TOKEN=local-dev-token
      - NODE_BOOTSTRAP_ROUTERS=["tcp/scheduler:7447"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scheduler:
        condition: service_healthy
    networks:
      - pi-test-net

  node-worker-2:
    build:
      <<: *service-build
      args:
        SERVICE_DIR: packages/node
    container_name: pi-node-worker-2
    # Same start command as worker 1; see the comment there.
    command: ["python", "-m", "node.main"]
    ports:
      - "8081:8080"
    environment:
      - NODE_NODE_ID=node-worker-2
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8080
      - NODE_SCHEDULER_URL=http://scheduler:8000
      - NODE_OLLAMA_HOST=${NODE_OLLAMA_HOST:-http://host.docker.internal:11434}
      # Deliberately NOT worker-1's credential. See the comment above.
      - NODE_NETWORK_AUTH_TOKEN=worker-2-own-credential
      - NODE_FLEET_TOKEN=local-dev-token
      - NODE_BOOTSTRAP_ROUTERS=["tcp/scheduler:7447"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      scheduler:
        condition: service_healthy
    networks:
      - pi-test-net

  # Optional stand-in for a model server, for environments that have neither Ollama
  # nor GPUs -- CI being exactly that. It speaks the three endpoints the node uses
  # (/api/tags, /api/show, /api/generate) and serves one deterministic model. Start
  # it with `--profile fake-ollama` and set NODE_OLLAMA_HOST=http://ollama-spoof:11434.
  # Everything between the gateway and this stand-in is the real system; the
  # stand-in exists because "the node's model daemon" is out of scope for a
  # container topology, not because any part of the stack under test is fake.
  ollama-spoof:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY scripts/spoof_ollama.py /app/spoof_ollama.py
        CMD ["python", "/app/spoof_ollama.py", "--host", "0.0.0.0", "--port", "11434"]
    profiles: ["fake-ollama"]
    container_name: pi-fake-ollama
    networks:
      - pi-test-net

networks:
  pi-test-net:
    driver: bridge
