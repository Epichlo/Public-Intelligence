name: Public Intelligence Multi-OS CI/CD Pipeline

# This workflow deliberately contains NO list of checks.
#
# Every check lives in `scripts/verify.sh`, and CI invokes that file and nothing
# else. Before this, CI ran `ruff check ./Node ./Scheduler` while CLAUDE.md told
# contributors to run `ruff check <pkg>/src`; the narrower command passed locally,
# the wider one failed here, and a red build reached main. Two lists meant two
# answers to "does this pass". There is now one.
#
# If you want to add a check, add it to scripts/verify.sh. Do not add a step here.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One run should surface every broken platform, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the floor both packages declare in requires-python. 3.14 is what
        # the local .venvs run, and was previously untested here -- so "green
        # locally" was green on the one interpreter CI never exercised.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Packages
        # The [dev] extras pin ruff, mypy, bandit and pytest exactly. CI used to
        # `pip install --upgrade` them unpinned, so a tool release could turn main
        # red with no code change, and local could disagree with CI about what passes.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "./packages/node[dev]"
          pip install -e "./packages/scheduler[dev]"

      - name: Verify
        shell: bash
        run: ./scripts/verify.sh

      - name: Upload verify receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-receipt-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .verify-receipt.json
          if-no-files-found: ignore

  fresh-clone:
    name: Fresh clone can be built and run
    runs-on: ubuntu-latest
    steps:
      # Nothing else proves a stranger can get from `git clone` to a working
      # install. Before the monorepo migration this repo shipped for a period with
      # no `.gitmodules` while CI checked out `submodules: recursive`, so every
      # submodule directory came up empty and `pip install -e ./Node` would have
      # failed on step one -- and no job would have noticed. Getting an outside
      # contributor to a running node is the actual v1 goal, so it gets a job.
      - name: Clone as an outsider would
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" fresh
          cd fresh
          test ! -f .gitmodules || { echo "::error::.gitmodules came back"; exit 1; }
          for d in packages/node packages/scheduler packages/website; do
            test -n "$(ls -A "$d" 2>/dev/null)" || {
              echo "::error::$d is empty in a fresh clone"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from a clean checkout
        working-directory: fresh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "./packages/node[dev]"
          pip install -e "./packages/scheduler[dev]"

      - name: Both packages import
        working-directory: fresh
        run: python -c "import node, scheduler; print('node + scheduler import OK')"
