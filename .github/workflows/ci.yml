name: Public Intelligence Multi-OS CI/CD Pipeline

# This workflow deliberately contains NO list of checks.
#
# Every check lives in `scripts/verify.sh`, and CI invokes that file and nothing
# else. Before this, CI ran `ruff check ./Node ./Scheduler` while CLAUDE.md told
# contributors to run `ruff check <pkg>/src`; the narrower command passed locally,
# the wider one failed here, and a red build reached main. Two lists meant two
# answers to "does this pass". There is now one.
#
# If you want to add a check, add it to scripts/verify.sh. Do not add a step here.
# (The fresh-clone job and the two scenario jobs below are not checks of the tree;
# they are proofs that the things this repo ships -- an installer, a compose stack --
# actually work. verify.sh cannot host them: they need a specific OS, Docker, or a
# throwaway copy, and each pins one shipped artefact rather than gate-listing.)

on:
  push:
    # Every branch, not just main/master. Work on a feature branch previously got NO
    # CI at all: the first run it ever saw was the PR opening, which is the latest
    # moment a defect can be found and the most expensive one to fix.
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

# A branch with an open PR now fires BOTH a push event (refs/heads/<branch>) and a
# pull_request event (refs/pull/N/merge). Those are different refs, so grouping on
# github.ref alone would let them double-execute; keying the group on the SOURCE
# branch name for PRs makes both events land in one group, so the later run
# supersedes the earlier instead of racing it. Branches stay isolated from each
# other, and pushes to main supersede each other as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One run should surface every broken platform, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the floor both packages declare in requires-python. 3.14 is what
        # the local .venvs run, and was previously untested here -- so "green
        # locally" was green on the one interpreter CI never exercised.
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Set up Node
        # For the website checks in scripts/verify.sh. Those steps SKIP when
        # packages/website/node_modules is absent, so without this step CI would
        # print a green PASS having silently not checked 4,270 lines -- the exact
        # shape of failure ROADMAP C6 exists to close.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: packages/website/package-lock.json

      - name: Install Packages
        # The [dev] extras pin ruff, mypy, bandit and pytest exactly. CI used to
        # `pip install --upgrade` them unpinned, so a tool release could turn main
        # red with no code change, and local could disagree with CI about what passes.
        #
        # `npm ci` lives HERE, in the install step, and not as a check of its own.
        # tests/test_source_parity.py forbids ruff|mypy|bandit|pytest appearing in
        # this file so CI cannot grow a second list of checks; installation is not a
        # check, so the rule is respected in substance and not merely in letter.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # shared FIRST: both services declare it as a dependency, and installing
          # it from the local path rather than letting pip look for it on PyPI (where
          # it does not exist) is what makes the editable installs below resolve.
          pip install -e ./packages/shared
          pip install -e "./packages/node[dev]"
          pip install -e "./packages/scheduler[dev]"
          npm ci --prefix packages/website

      - name: Verify
        shell: bash
        run: ./scripts/verify.sh

      # CI is the third trust tier: it runs the same gate on a clean checkout, where
      # nothing was skipped. Publishing the bundle is not a CHECK -- the check list
      # still lives entirely in scripts/verify.sh, which is what
      # tests/test_source_parity.py::test_ci_delegates_to_the_verify_script pins.
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle-${{ matrix.os }}-py${{ matrix.python-version }}
          path: zones/verified/latest.verified.json
          if-no-files-found: ignore

  fresh-clone:
    name: Fresh clone can be built and run
    runs-on: ubuntu-latest
    steps:
      # Nothing else proves a stranger can get from `git clone` to a working
      # install. Before the monorepo migration this repo shipped for a period with
      # no `.gitmodules` while CI checked out `submodules: recursive`, so every
      # submodule directory came up empty and `pip install -e ./Node` would have
      # failed on step one -- and no job would have noticed. Getting an outside
      # contributor to a running node is the actual v1 goal, so it gets a job.
      - name: Clone as an outsider would
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" fresh
          cd fresh
          test ! -f .gitmodules || { echo "::error::.gitmodules came back"; exit 1; }
          for d in packages/node packages/scheduler packages/website packages/shared; do
            test -n "$(ls -A "$d" 2>/dev/null)" || {
              echo "::error::$d is empty in a fresh clone"; exit 1; }
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from a clean checkout
        working-directory: fresh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ./packages/shared
          pip install -e "./packages/node[dev]"
          pip install -e "./packages/scheduler[dev]"

      - name: All three packages import
        working-directory: fresh
        run: |
          python -c "import node, scheduler, pi_shared; print('node + scheduler + pi_shared import OK')"
          # The re-export shims are the seam a fresh clone is most likely to get
          # wrong, because they are the only place the three packages meet.
          python -c "from node.core.mesh_auth import seal; from scheduler.core.mesh_auth import seal as s2; assert seal is s2"

  install-windows:
    name: install.ps1 actually installs (Windows)
    timeout-minutes: 30
    runs-on: windows-latest
    # The POSIX installer has been executed for real by scripts/verify_install.sh
    # since the monorepo migration silently broke it. install.ps1 has NEVER been
    # executed by anything: the gate is bash, so every Windows install defect found
    # so far was found by a human mid-install. This job runs it for real, against a
    # throwaway copy, and then demands POSITIVE evidence -- exit code 0 is not
    # evidence. W3 shipped an installer that printed "Installation Complete!" over a
    # failed pip and exited 0.
    steps:
      - uses: actions/checkout@v4

      - name: Run the installer for real against a throwaway copy
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:RUNNER_TEMP "pi-windows-install"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          # The WORKING TREE, mirroring verify_install.sh's rsync: exclude the venv,
          # git metadata and caches so the installer builds its environment from
          # nothing, the way a host's would.
          robocopy "$env:GITHUB_WORKSPACE" $dest /E `
            /XD .git .venv node_modules __pycache__ .kilo zones .secrets `
            /XF *.pyc /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          Push-Location $dest
          try {
            try {
              & .\install.ps1
            } catch {
              # A terminating PowerShell error inside the script does not set
              # $LASTEXITCODE, so without this a crashed installer could look like a
              # passing one -- the exact success-over-failure shape W3 shipped.
              throw "install.ps1 raised: $_"
            }
            if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Assert positive evidence of a working install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nodeDir = Join-Path $env:RUNNER_TEMP "pi-windows-install\packages\node"
          $py = Join-Path $nodeDir ".venv\Scripts\python.exe"
          if (-not (Test-Path $py)) { throw "installer produced no usable venv interpreter at $py" }

          $envFile = Join-Path $nodeDir ".env"
          if (-not (Test-Path $envFile)) { throw "installer did not create packages\node\.env" }
          $lines = Get-Content $envFile
          foreach ($key in @("NODE_ID", "NODE_SCHEDULER_URL", "NODE_NETWORK_AUTH_TOKEN", "NODE_FLEET_TOKEN")) {
            if (-not ($lines | Where-Object { $_ -match "^$key=" })) { throw ".env is missing $key" }
          }
          # The control API fails closed without its credential; a token shorter than
          # 16 hex chars means the generator did not really run.
          $own = ($lines | Select-String '^NODE_NETWORK_AUTH_TOKEN=(.+)$').Matches[0].Groups[1].Value
          if ($own.Length -lt 16) { throw "generated NODE_NETWORK_AUTH_TOKEN is implausibly short" }

          # The weakest claim worth making: pip can succeed and still leave a package
          # that cannot be imported.
          & $py -c "import node, node.main, pi_shared; print('installed venv imports the node package')"
          if ($LASTEXITCODE -ne 0) { throw "the installed interpreter cannot import the node package" }
          Write-Host "OK: env written, venv built, node package importable from it"

      - name: Stop the daemon the installer launched, then delete the copy
        if: always()
        shell: pwsh
        run: |
          # install.ps1 unconditionally starts a detached background daemon via
          # Start-Process pythonw.exe. Nothing in this job asserts on that daemon --
          # Ollama and the Scheduler do not exist here -- but nothing may leave one
          # running either.
          $dest = Join-Path $env:RUNNER_TEMP "pi-windows-install"
          Get-CimInstance Win32_Process |
            Where-Object { $_.ExecutablePath -like "$dest*" } |
            ForEach-Object {
              Write-Host "stopping leftover daemon pid $($_.ProcessId): $($_.ExecutablePath)"
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }
          Start-Sleep -Seconds 2
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue }

  compose-e2e:
    name: Two-node compose stack serves a request end to end
    timeout-minutes: 25
    runs-on: ubuntu-latest
    # docker-compose.test.yml had never been run anywhere: its images could not
    # build (public-intelligence-shared is a local-path dependency invisible from
    # their build contexts), and its scheduler healthcheck called curl, which the
    # runtime image does not contain -- so even a successful build would never have
    # gone healthy and the nodes would never have started. This job runs the stack
    # for real and drives ONE request through gateway -> scheduler -> mesh -> node,
    # which is docs/PREMISES.md P2, the load-bearing claim of the project.
    #
    # Ollama itself is out of scope for a container topology: the node talks to it
    # over HTTP as an external service, exactly as it would on a host. The stack's
    # optional `fake-ollama` profile supplies a stand-in speaking those endpoints;
    # everything between the gateway and the model server is the real system.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the gateway credential tooling
        run: python -m pip install --quiet "pyjwt[crypto]>=2.8,<3"

      - name: Mint the keypair the stack will verify against, and a caller token
        run: |
          python scripts/mint_token.py --generate-keypair --force
          TOKEN="$(python scripts/mint_token.py --tenant ci-compose-e2e --hours 1 | head -n1)"
          test -n "$TOKEN" || { echo "::error::minted no caller token"; exit 1; }
          echo "CALLER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Bring the stack up
        run: |
          export SCHEDULER_JWT_PUBLIC_KEY="$(cat .secrets/jwt_public_key.pem)"
          export NODE_OLLAMA_HOST="http://ollama-spoof:11434"
          docker compose -f docker-compose.test.yml --profile fake-ollama up -d --build

      - name: Both nodes register through the fleet credential
        run: |
          deadline=$((SECONDS + 180))
          until curl -fsS -H "X-Network-Auth-Token: local-dev-token" http://localhost:8000/nodes \
              | tee /tmp/nodes.json | jq -e '
                ([.[].node_id] | sort) == ["node-worker-1", "node-worker-2"]' >/dev/null 2>&1; do
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::timed out waiting for both workers to register"
              cat /tmp/nodes.json 2>/dev/null || true
              docker compose -f docker-compose.test.yml ps -a || true
              docker compose -f docker-compose.test.yml logs --tail 80 || true
              exit 1
            fi
            sleep 3
          done
          echo "--- registered nodes ---"
          jq . /tmp/nodes.json

      - name: An uncredentialed gateway request is refused
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{"model":"ci-test-model","messages":[{"role":"user","content":"ping"}]}')
          echo "unauthenticated POST -> HTTP $code"
          [ "$code" = "401" ] || { echo "::error::expected 401 without a bearer token, got $code"; exit 1; }

      - name: One request crosses gateway, scheduler, mesh and node
        run: |
          deadline=$((SECONDS + 120))
          while true; do
            code=$(curl -sS -o /tmp/completion.json -w "%{http_code}" \
              -X POST http://localhost:8000/v1/chat/completions \
              -H "Authorization: Bearer $CALLER_TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"model":"ci-test-model","messages":[{"role":"user","content":"ping"}]}')
            [ "$code" = "200" ] && break
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::chat completion never returned 200 (last: $code)"
              cat /tmp/completion.json 2>/dev/null || true
              docker compose -f docker-compose.test.yml logs --tail 120 || true
              exit 1
            fi
            sleep 3
          done
          cat /tmp/completion.json
          # Positive content evidence, not just a status line: the completion body
          # must carry text produced by the model server behind worker 1 or 2.
          jq -e '.choices[0].message.content | test("\\[spoof-ollama:")' /tmp/completion.json \
            || { echo "::error::completion carried no generated content"; exit 1; }
          jq -e '.usage.total_tokens > 0' /tmp/completion.json \
            || { echo "::error::completion was not metered as usage"; exit 1; }

      - name: Tear the stack down
        if: always()
        run: |
          docker compose -f docker-compose.test.yml --profile fake-ollama down -v --remove-orphans || true
