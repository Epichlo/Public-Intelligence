[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-intelligence-shared"
version = "1.0.0"
description = "Code that must be byte-identical in the Node and the Scheduler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Only what the shared modules themselves import. Deliberately minimal: anything
# added here is added to BOTH services, so this list is the shared blast radius.
dependencies = ["cryptography"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_shared = ["py.typed"]
