[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "public-intelligence-node"
version = "0.1.0"
description = "Public Intelligence Node compute worker"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.2.0",
    "eclipse-zenoh",
    "cryptography",
    # The shared mesh protocol (ROADMAP C8). Both services must agree on these
    # BYTE FOR BYTE -- if the two former copies drifted, the Scheduler silently
    # stopped accepting envelopes from real nodes, with nothing raised.
    "public-intelligence-shared",
    "psutil",
    # Both were imported at module scope while undeclared, and both resolved anyway
    # in the shared dev venv -- httpx because `ollama` happens to pull it, structlog
    # because the scheduler package declares it. A host installing ONLY this package
    # got `ModuleNotFoundError: structlog` on `import node.main`. Found by
    # scripts/verify_install.sh; ratcheted by tests/test_declared_dependencies.py.
    "httpx>=0.27.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    # Lint/type/security tools are PINNED EXACTLY, not floored. CI used to run
    # `pip install --upgrade ruff mypy bandit`, so a new ruff release could turn
    # main red with no code change, and local (0.16.0) could disagree with CI
    # (0.16.1) about what passes. These versions must match across both packages;
    # `tests/test_source_parity.py` enforces that.
    "ruff==0.16.1",
    "mypy==2.3.0",
    # Stub packages are part of the type gate, not optional extras. Without
    # this mypy reports import-untyped for psutil, which passed locally only
    # because the stubs happened to be in the venv and not in CI.
    "types-psutil==7.2.2.20260518",
    "bandit==1.9.4",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
public-intelligence-node = "node.main:cli_main"

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561 marker. Both packages set `strict = true` and are clean under it, but
# without py.typed that type information is invisible to everything downstream:
# mypy reported `module is installed, but missing library stubs or py.typed
# marker` for all 26 imports the root `tests/` suite makes into them, which meant
# ROADMAP C7's "type-check tests/" would have checked nothing but the test files'
# own local variables.
[tool.setuptools.package-data]
node = ["py.typed"]

# ---------------------------------------------------------------------------
# SHARED LINT CONFIG -- must stay byte-identical to the matching block in the
# other package's pyproject.toml. `tests/test_source_parity.py` in the root
# suite fails if they diverge.
#
# Why duplicated: Node and Scheduler are separate git repositories, so a shared
# root config file would not exist in a standalone clone of either one.
#
# History: these two configs used to differ -- ARG was enabled on Node only, and
# line-length was 100 vs 99. `ruff check ./Node ./Scheduler` therefore applied
# different rules to each subtree, so "does this pass lint" had no single answer
# and depended on which directory the file happened to live in.
#
# TC (flake8-type-checking) is deliberately NOT enabled: FastAPI resolves type
# annotations at runtime for dependency injection and response models, so moving
# those imports into `if TYPE_CHECKING:` blocks breaks the app at import time.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1514 (unspecified-encoding) is preview-gated, and `explicit-preview-rules`
# means ONLY the preview rules named here activate -- turning preview on wholesale
# would enable every other preview rule in these categories, which can change
# between ruff releases. One rule, one blast radius.
#
# It is here because ROADMAP 2.7 passed the local gate and failed CI on all three
# Windows legs: `Path.read_text()` with no encoding resolves to the platform
# default, UTF-8 here and cp1252 there. See specs/lint-the-tests-and-the-encodings.md.
preview = true
explicit-preview-rules = true
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "RUF",
    "PLW1514",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must mirror the signature of the thing they stand in for -- a fake
# Zenoh session takes `**kwargs` it never reads, a fake Query takes the `key_expr`
# the real one is called with. Dropping those parameters would hide the real API.
# This exemption is ARG-only and applies only to tests; `src/` has every rule on
# and is clean under all of them.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# "auto", matching Scheduler. Under the default strict mode an async test whose
# marker was forgotten does not fail -- it is skipped with a warning, so it looks
# like a passing suite while testing nothing. This repo mixes @pytest.mark.anyio
# (97 uses) and @pytest.mark.asyncio (78), which makes forgetting one easy.
asyncio_mode = "auto"
